[package]
name = "elefant-client"
version = "0.1.0"
edition = "2021"

[dependencies]
futures = { version = "0.3", optional = true }
tokio = { version = "1", default-features = false, features = ["net", "io-util"], optional = true }
tokio-util = { version = "0.7", optional = true, default-features = false, features = ["compat"] }
rand = "0.9"
base64 = "0.22"
hmac = "0.12"
md-5 = "0.10"
sha2 = "0.10"
stringprep = "0.1"
time = { version = "0.3", features = ["formatting", "parsing"], optional = true }
uuid = { version = "1.0", optional = true }
serde_json = { version = "1.0", optional = true }
rust_decimal = { version = "1.36", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
tracing = "0.1"
elefant-client-macros = { path = "../elefant-client-macros", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
time = { version = "0.3", features = ["macros"] }

[features]
tokio = ["dep:tokio", "dep:tokio-util", "futures"]
futures = ["dep:futures"]
time = ["dep:time"]
uuid = ["dep:uuid"]
json = ["dep:serde_json"]
decimal = ["dep:rust_decimal"]
pg_interval = []
serde = ["dep:serde"]
derive = ["dep:elefant-client-macros"]
