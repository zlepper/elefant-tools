[package]
name = "elefant-client-macros"
version = "0.1.0"
edition = "2021"
description = "Provides macros for the elefant-client crate"
license = "MIT"

[lib]
proc-macro = true

[dependencies]
syn = { workspace = true, features = ["derive"] }
quote = { workspace = true }
proc-macro2 = { workspace = true }
proc-macro-crate = { workspace = true }
