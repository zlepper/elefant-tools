[workspace]
resolver = "2"
members = [
    "elefant-tools",
    "elefant-sync",
    "elefant-test-macros",
    "drop-all-test-databases",
    "benchmark-import-prepare",
    "elefant-client",
    "codegen", "compare-with-tokio-postgres", "elefant-client-macros"]

[workspace.dependencies]
# Internal crates
elefant-client = { path = "elefant-client" }
elefant-client-macros = { path = "elefant-client-macros" }
elefant-tools = { path = "elefant-tools", version = "0.0.7" }
elefant-test-macros = { path = "elefant-test-macros" }

# Async runtime
tokio = { version = "1", default-features = false }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Data types
uuid = "1.10"
ordered-float = { version = "4.2", features = ["serde"] }
time = "0.3"
rust_decimal = "1.36"
itertools = "0.13"

# Crypto/Auth
rand = "0.9"
base64 = "0.22"
hmac = "0.12"
md-5 = "0.10"
sha2 = "0.10"
stringprep = "0.1"

# TLS
rustls = { version = "0.23", default-features = false }
rustls-pki-types = "1"
x509-cert = { version = "0.2", default-features = false }
der = { version = "0.7", default-features = false }

# Proc macros
syn = "2.0"
quote = "1.0"
proc-macro2 = "1.0"
proc-macro-crate = "3"
darling = "0.20"

# Testing
indoc = "2"
similar-asserts = "1.6"
criterion = "0.6"

# Other
tokio-postgres = "0.7"

[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 1

[profile.release]
debug = "full"
split-debuginfo = "off"
#lto = "fat"


[profile.profiling]
inherits = "release"
debug = true
